<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F16 Drone</title>
<script src="lang.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo">&#9992;</div>
    <div><h1 data-t="title"></h1><small data-t="sub"></small></div>
  </div>
  <nav>
    <a href="index.html" class="on" data-t="nav_home"></a>
    <a href="#map" data-t="nav_map"></a>
    <a href="kurulum.html" data-t="nav_guide"></a>
  </nav>
  <div class="tools">
    <span class="pill"><i class="dot"></i><b id="mode" data-t="connecting"></b></span>
    <script>document.write(langSelect())</script>
  </div>
</header>

<main class="grid">
  <!-- الحالة -->
  <section class="card span4">
    <h3 data-t="box_status"></h3>
    <div class="stats">
      <div class="stat"><span data-t="motors"></span><b id="s_armed">-</b></div>
      <div class="stat"><span data-t="flight"></span><b id="s_flying">-</b></div>
      <div class="stat"><span data-t="alt"></span><b id="s_alt">-</b></div>
      <div class="stat"><span data-t="speed"></span><b id="s_speed">-</b></div>
      <div class="stat"><span data-t="pos"></span><b id="s_pos">-</b></div>
      <div class="stat"><span data-t="heading"></span><b id="s_head">-</b></div>
    </div>
    <div class="batt"><span data-t="battery"></span><b id="s_bat">-</b></div>
    <div class="bar"><div id="batbar" style="width:100%"></div></div>
    <label class="row"><span data-t="speed_set"></span>
      <select id="spd" onchange="cmd('speed', this.value)">
        <option>1</option><option selected>2</option><option>5</option><option>10</option><option>15</option>
      </select>
    </label>
  </section>

  <!-- التحكم -->
  <section class="card span4">
    <h3 data-t="box_basic"></h3>
    <div class="btns">
      <button class="btn" onclick="cmd('arm')" data-t="b_arm"></button>
      <button class="btn" onclick="cmd('disarm')" data-t="b_disarm"></button>
      <button class="btn primary" onclick="cmd('takeoff')">&#8593; <span data-t="b_takeoff"></span></button>
      <button class="btn" onclick="cmd('land')">&#8595; <span data-t="b_land"></span></button>
      <button class="btn wide" onclick="cmd('home')">&#8962; <span data-t="b_home"></span></button>
    </div>
    <h3 data-t="box_dir"></h3>
    <div class="pad">
      <button class="btn" onclick="cmd('yaw_l')">&#8634;<small data-t="yaw"></small></button>
      <button class="btn" onclick="cmd('forward')">&#9650;<small data-t="forward"></small></button>
      <button class="btn" onclick="cmd('yaw_r')">&#8635;<small data-t="yaw"></small></button>
      <button class="btn" onclick="cmd('right')">&#9654;<small data-t="right"></small></button>
      <button class="btn" onclick="cmd('back')">&#9660;<small data-t="back"></small></button>
      <button class="btn" onclick="cmd('left')">&#9664;<small data-t="left"></small></button>
      <button class="btn" onclick="cmd('up')" data-t="up"></button>
      <button class="btn" onclick="cmd('down')" data-t="down"></button>
    </div>
    <p class="hint" data-t="keys_hint"></p>
    <button class="btn stop" onclick="cmd('stop')">&#9888; <span data-t="estop_btn"></span></button>
  </section>

  <!-- الرادار والسجل -->
  <section class="card span4">
    <h3 data-t="box_radar"></h3>
    <canvas id="radar" width="260" height="200"></canvas>
    <h3 data-t="box_log"></h3>
    <div id="log"></div>
  </section>

  <!-- الخريطة -->
  <section class="card span8">
    <h3 data-t="box_map"></h3>
    <div id="map"></div>
    <p class="meta"><b data-t="ac_count"></b> <b id="ac_n">-</b> · <span id="ac_msg" data-t="map_src"></span></p>
  </section>

  <!-- إذن الإقلاع -->
  <section class="card span4">
    <h3 data-t="box_permit"></h3>
    <div class="form">
      <label><span data-t="p_pilot"></span><input id="p_pilot"></label>
      <label><span data-t="p_reg"></span><input id="p_reg" placeholder="TR-IHA-0001"></label>
      <label><span data-t="p_purpose"></span><input id="p_purpose"></label>
      <div class="two">
        <label><span data-t="p_alt"></span><input id="p_alt" type="number" value="50"></label>
        <label><span data-t="p_dur"></span><input id="p_dur" type="number" value="15"></label>
      </div>
      <button class="btn primary" onclick="requestPermit()" data-t="p_request"></button>
    </div>
    <div id="permit"></div>
    <p class="hint" data-t="p_note"></p>
  </section>
</main>
<footer class="foot"><span data-t="footer"></span> · <a href="kurulum.html" data-t="nav_guide"></a> · <a href="#" data-t="privacy"></a></footer>

<script>
// يحاول الاتصال بـ drone.py، وإذا ما لقاه يشتغل وضع محاكاة داخل المتصفح
var API = location.protocol.indexOf('http') === 0 ? '' : 'http://localhost:8080';
var online = false;
var sim = { armed:false, flying:false, alt:0, x:0, y:0, heading:0, speed:2, battery:100, target_alt:0, log:['-- ready'] };

function simCmd(c, v) {
  var s = sim, say = function(m){ s.log.push(new Date().toTimeString().slice(0,8)+' '+m); s.log = s.log.slice(-15); };
  if (c=='arm') { s.armed=true; say('armed'); }
  else if (c=='disarm') { if (s.flying) say('arm_in_flight'); else { s.armed=false; say('disarmed'); } }
  else if (c=='takeoff') { if (!s.armed) say('arm_first'); else { s.flying=true; s.target_alt=10; say('takeoff'); } }
  else if (c=='land') { s.target_alt=0; say('landing'); }
  else if ({forward:0,right:90,back:180,left:270}[c] !== undefined) {
    if (!s.flying) { say('on_ground'); return; }
    var a=(s.heading+{forward:0,right:90,back:180,left:270}[c])*Math.PI/180;
    s.x+=Math.sin(a)*s.speed; s.y+=Math.cos(a)*s.speed; say('move '+c);
  }
  else if (c=='up' && s.flying) s.target_alt=Math.min(s.target_alt+2,120);
  else if (c=='down' && s.flying) s.target_alt=Math.max(s.target_alt-2,1);
  else if (c=='yaw_l') s.heading=(s.heading+345)%360;
  else if (c=='yaw_r') s.heading=(s.heading+15)%360;
  else if (c=='speed') { s.speed=+v; say('speed '+v); }
  else if (c=='home') { s.x=s.y=0; say('home'); }
  else if (c=='stop') { s.flying=s.armed=false; s.alt=s.target_alt=0; say('estop'); }
}
setInterval(function(){
  if (online || !sim.flying) return;
  sim.alt += (sim.target_alt-sim.alt)*0.2; sim.battery=Math.max(0,sim.battery-0.05);
  if (sim.target_alt==0 && sim.alt<0.1) { sim.alt=0; sim.flying=false; sim.log.push(new Date().toTimeString().slice(0,8)+' landed'); }
}, 200);

function cmd(c, v) {
  if (c == 'takeoff' && !permitValid()) { alert(t('l_no_permit')); return; }
  if (!online) { simCmd(c, v); render(sim); return; }
  fetch(API+'/cmd?c='+c+(v?'&v='+v:'')).then(function(r){return r.json();}).then(render);
}

function poll() {
  fetch(API+'/status').then(function(r){return r.json();})
    .then(function(d){ online=true; document.getElementById('mode').setAttribute('data-t','online'); document.querySelector('.pill').className='pill on'; document.getElementById('mode').innerHTML=t('online'); render(d); })
    .catch(function(){ online=false; document.getElementById('mode').setAttribute('data-t','offline'); document.querySelector('.pill').className='pill'; document.getElementById('mode').innerHTML=t('offline'); render(sim); });
}
// ===== الخريطة الحية (Leaflet + OpenStreetMap) والطائرات من ADS-B مفتوح =====
var HOME = [41.0082, 28.9784], planes = [], map, droneMk, homeMk, zone, acLayer;
function initMap() {
  map = L.map('map').setView(HOME, 11);
  var dark = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, className:'dark-tiles', attribution:'&copy; OpenStreetMap'}).addTo(map);
  var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'});
  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Esri'});
  L.control.layers({'Dark':dark, 'Map':osm, 'Satellite':sat}).addTo(map);
  acLayer = L.layerGroup().addTo(map);
  zone = L.circle(HOME, {radius:5000, color:'#6366f1', weight:1, fill:false, dashArray:'4'}).addTo(map);
  homeMk = L.circleMarker(HOME, {radius:6, color:'#22d3ee'}).addTo(map);
  droneMk = L.marker(HOME, {icon:L.divIcon({className:'dronei', html:'&#10023;', iconSize:[16,16]})}).addTo(map);
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(function(p){
    HOME = [p.coords.latitude, p.coords.longitude]; map.setView(HOME, 11);
    zone.setLatLng(HOME); homeMk.setLatLng(HOME); loadPlanes();
  });
}
// إزاحة بالأمتار → إحداثيات
function offset(x, y) { return [HOME[0] + y/111320, HOME[1] + x/(111320*Math.cos(HOME[0]*Math.PI/180))]; }
function km(a, b) {
  var R=6371, dLa=(b[0]-a[0])*Math.PI/180, dLo=(b[1]-a[1])*Math.PI/180;
  var h=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.sqrt(h));
}
function acMsg(k) { var e = document.getElementById('ac_msg'); e.setAttribute('data-t', k); e.innerHTML = t(k); }
function loadPlanes() {
  var la = HOME[0].toFixed(4), lo = HOME[1].toFixed(4);
  // محلياً عبر drone.py، وعلى GitHub Pages عبر بروكسي CORS عام (قد لا يعمل دائماً)
  var url = online ? API+'/aircraft?lat='+la+'&lon='+lo+'&dist=40'
    : 'https://corsproxy.io/?url='+encodeURIComponent('https://api.adsb.lol/v2/lat/'+la+'/lon/'+lo+'/dist/40');
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    if (d.error) throw d.error;
    if (d.ac) d = d.ac.filter(function(a){ return a.lat; }).map(function(a){
      return {call:(a.flight||a.r||a.hex||'').trim(), lat:a.lat, lon:a.lon, alt:Math.round((+a.alt_baro||0)*0.3048), trk:a.track||0, spd:Math.round((a.gs||0)*1.852)}; });
    planes = d; acLayer.clearLayers();
    d.forEach(function(a){
      L.marker([a.lat, a.lon], {icon:L.divIcon({className:'plane', iconSize:[18,18],
        html:'<div style="transform:rotate('+(a.trk-90)+'deg)">&#9992;</div>'})})
        .bindPopup('<b>'+a.call+'</b><br>'+t('alt')+': '+a.alt+' '+t('m')+'<br>'+t('speed')+': '+a.spd+' km/h').addTo(acLayer);
    });
    document.getElementById('ac_n').innerHTML = d.length;
    acMsg('map_src');
  }).catch(function(){ acMsg('map_need_server'); });
}

// ===== إذن الإقلاع =====
var permit = null, permitWhy = [];
function permitValid() { return permit && Date.now() < permit.until; }
function requestPermit() {
  function v(id){ return document.getElementById(id).value.trim(); }
  var why = [];
  if (!v('p_pilot') || !v('p_reg') || !v('p_purpose') || !(+v('p_dur') > 0)) why.push('chk_fields');
  if (last.battery < 30) why.push('chk_bat');
  if (+v('p_alt') > 120) why.push('chk_alt');
  if (planes.some(function(a){ return a.alt < 1500 && km(HOME, [a.lat, a.lon]) < 5; })) why.push('chk_traffic');
  permit = why.length ? null : { id:'F16-'+Math.random().toString(36).slice(2,8).toUpperCase(), until:Date.now()+(+v('p_dur'))*60000 };
  permitWhy = why; showPermit();
}
function showPermit() {
  var el = document.getElementById('permit');
  if (permitValid()) { el.className='ok'; el.innerHTML='&#10004; '+t('p_granted')+' <b>'+permit.id+'</b><br>'+t('p_valid')+' '+new Date(permit.until).toTimeString().slice(0,5); }
  else if (permitWhy.length) { el.className='no'; el.innerHTML='&#10008; '+t('p_denied')+'<br>- '+permitWhy.map(t).join('<br>- '); }
  else { el.className='no'; el.innerHTML='&#128274; '+t('p_none'); }
}

initMap(); applyLang(); showPermit();
setInterval(poll, 500); poll();
setTimeout(loadPlanes, 1500); setInterval(loadPlanes, 15000);

var trail = [], last = sim;
window.onLang = function(){ render(last); if (window.showPermit) showPermit(); };
// سطر السجل: "HH:MM:SS key arg" → نص مترجم
function logLine(l) {
  var p = l.split(' '), arg = p[2] || '';
  if (p[1] == 'move') arg = t(arg);
  if (p[1] == 'speed') arg += ' ' + t('ms');
  return (p[0] == '--' ? '' : p[0] + ' ') + t('l_' + p[1]) + (arg ? ' ' + arg : '');
}
function render(d) {
  last = d;
  function $(id){ return document.getElementById(id); }
  $('s_armed').innerHTML = d.armed ? '<span class="green">'+t('on')+'</span>' : '<span class="red">'+t('off')+'</span>';
  $('s_flying').innerHTML = d.flying ? '<span class="green">'+t('in_air')+'</span>' : t('ground');
  $('s_alt').innerHTML = d.alt.toFixed(1)+' '+t('m');
  $('s_pos').innerHTML = d.x.toFixed(1)+' / '+d.y.toFixed(1);
  $('s_head').innerHTML = d.heading+'&deg;';
  $('s_speed').innerHTML = d.speed+' '+t('ms');
  $('s_bat').innerHTML = d.battery.toFixed(0)+'%';
  $('batbar').style.width = d.battery+'%';
  if (droneMk) droneMk.setLatLng(offset(d.x, d.y));
  $('log').innerHTML = d.log.slice().reverse().map(logLine).join('<br>');

  // الرادار
  var cv=$('radar'), g=cv.getContext('2d'), cx=130, cy=100, k=3;
  g.fillStyle='#0a0f1c'; g.fillRect(0,0,260,200);
  g.strokeStyle='rgba(99,102,241,.35)';
  for (var r=30;r<=90;r+=30){ g.beginPath(); g.arc(cx,cy,r,0,7); g.stroke(); }
  g.beginPath(); g.moveTo(0,cy); g.lineTo(260,cy); g.moveTo(cx,0); g.lineTo(cx,200); g.stroke();
  var px=cx+d.x*k, py=cy-d.y*k;
  trail.push([px,py]); if (trail.length>60) trail.shift();
  g.fillStyle='rgba(34,211,238,.5)'; trail.forEach(function(p){ g.fillRect(p[0],p[1],2,2); });
  g.save(); g.translate(px,py); g.rotate(d.heading*Math.PI/180);
  g.fillStyle = d.flying ? '#22d3ee' : '#64748b';
  g.beginPath(); g.moveTo(0,-8); g.lineTo(6,6); g.lineTo(-6,6); g.closePath(); g.fill(); g.restore();
  g.fillStyle='#94a3b8'; g.font='10px JetBrains Mono, monospace'; g.fillText('N',cx-3,10); g.fillText('H',cx+3,cy-3);
}

document.onkeydown = function(e){
  var m = {w:'forward',s:'back',a:'left',d:'right',q:'yaw_l',e:'yaw_r',r:'up',f:'down',' ':'stop'}[e.key.toLowerCase()];
  if (m) { e.preventDefault(); cmd(m); }
};
</script>
</body>
</html>
